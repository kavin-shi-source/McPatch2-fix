[core]
exclude-rules = []
webui-mode = false

[core.mod-platform.curseforge]
api-key = "$2a$10$ENS1BEMMfnrN1.UOBeyf9O.zMOCIUNrRID.QuZoOxgVwef47MsCeq"
rate-limit = 5

[core.mod-platform.modrinth]
rate-limit = 30

[core.mod-platform.cache]
ttl-searches = 600
ttl-mod-detail = 3600
ttl-versions = 3600
ttl-download = 300
ttl-fingerprint = 86400
max-entries = 500

[web]
listen-addr = "0.0.0.0"
listen-port = 6710
tls-cert-file = ""
tls-key-file = ""
cors-allow-credentials = false
cors-allow-headers = ["*"]
cors-allow-methods = ["*"]
cors-allow-origin = ["*"]
cors-allow-private-network = false
cors-expose-headers = ["*"]
index-filename = "index.html"
redirect-404 = "index.html"

[builtin-server]
enabled = true
listen-addr = "0.0.0.0"
listen-port = 6700
capacity = 0
regain = 0

[s3]
enabled = false
endpoint = ""
bucket = ""
region = ""
access-id = ""
secret-key = ""

[webdav]
enabled = false
host = ""
username = ""
password = ""
